;Custom_OpenClash_Rules
;Wnos 自用魔改版 v2.1（基于上游 Custom_Clash_Fallback.ini）
;上游作者：https://github.com/Aethersailor
;上游项目：https://github.com/Aethersailor/Custom_OpenClash_Rules
;个人规则仓库：https://github.com/wnosos6/wn_os_only_personal_use

[custom]
;==================== 规则标志位 ====================
;从上往下遍历，优先命中上位规则，顺序影响分流效果

;【1】个人自用规则（最高优先级，压过 private 与上游一切判断）
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/wnosos6/wn_os_only_personal_use@main/cfg/Wnos_Direct_Classical.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/wnosos6/wn_os_only_personal_use@main/cfg/Wnos_Manual_Classical.yaml,28800

;【2】本地地址与域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

;【3】上游收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

;【4】上游收录的代理规则
ruleset=🚀 故障转移,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 故障转移,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

;【5】谷歌在国内可用的域名直连（g.cn 之类，避免整段被代理带走）
ruleset=🎯 全球直连,[]GEOSITE,google-cn

;【6】国内游戏 / 下载平台 / BT Tracker 直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical_IP.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

;【7】来源为国内 IP 的流量直连
;多级路由/旁路由拓扑下生效；单机 TUN 场景源地址是内网私有 IP，本条不会命中，留着无害
ruleset=🎯 全球直连,[]SRC-GEOIP,cn

;【8】业务分流
;即时通讯包括 Telegram/WhatsApp/Line 等
ruleset=💬 即时通讯,[]GEOSITE,category-communication
;社交媒体包括 Twitter(X)/Facebook/Instagram 等
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 ChatGPT,[]GEOSITE,openai
;bing 国内外混部，cn.bing.com 命中直连会拖垮 Copilot，单独切走
ruleset=🤖 Copilot,[]GEOSITE,bing
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🚀 GitHub,[]GEOSITE,github
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎥 AppleTV+,[]GEOSITE,apple-tvplus
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 DisneyPlus,[]GEOSITE,disney
ruleset=🎥 HBO,[]GEOSITE,hbo
ruleset=🎥 PrimeVideo,[]GEOSITE,primevideo
ruleset=🎥 Emby,[]GEOSITE,category-emby
ruleset=🎻 Spotify,[]GEOSITE,spotify
ruleset=📺 Bahamut,[]GEOSITE,bahamut
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🌎 国外媒体,[]GEOSITE,category-entertainment
ruleset=🛒 国外电商,[]GEOSITE,category-ecommerce
ruleset=🚀 故障转移,[]GEOSITE,gfw
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,twitter,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,facebook,no-resolve
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

;【9】大陆白名单兜底（OpenClash 收录不全，留作兜底，可随时取消）
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

;【10】广告拦截
;排在 cn 兜底之后：只拦漏网广告域名，不碰已判定直连的国内站，避免误杀与拖慢
ruleset=REJECT,clash-classic:https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml,28800
ruleset=REJECT,clash-classic:https://gcore.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomolite.yaml,28800

;【11】非标端口（PT/BT 优化开启会使 80/443 以外端口流量直连）
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

;【12】漏网之鱼
;直连时无法通过 DNS 泄露测试，但并不存在泄露
ruleset=🐟 漏网之鱼,[]FINAL
;==================== 规则标志位结束 ====================


;==================== 节点分组标志位 ====================
;分层：地区组(地区内选最快) -> 故障转移(fallback 跨地区兜底) -> 业务组(select 手动可控)
;业务组选项固定 11 项，嫌长可删掉 []🚀 手动选择 一项，变成 10 项

;全部节点手动入口，兼作逃生口
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`.*

;故障转移：日 -> 美 -> 港 -> 新 -> 其他 -> 自动，前序不可用时顺延
custom_proxy_group=🚀 故障转移`fallback`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]其他节点`[]♻️ 自动选择`https://www.gstatic.com/generate_204`300,5

;全节点自动测速，故障转移与手动选择的内置兜底
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

;倍率分层：特价节点（0.x 倍率）单独成组
custom_proxy_group=💸 特价`url-test`(0(?:\.\d+)?x)`https://www.gstatic.com/generate_204`300,,50

;倍率分层：性价比节点
custom_proxy_group=💰 性价比`url-test`(赔钱|一分|良心)`https://www.gstatic.com/generate_204`300,,50

